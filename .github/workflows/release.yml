name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and validate release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$tag' must use semantic versioning, for example v0.1.0."
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($tag -ne $expectedTag) {
            throw "Release tag '$tag' does not match package.json version '$expectedTag'."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release commit is on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Releases must be built from a commit already merged into main."
          }

      - name: Install dependencies
        run: npm ci

      - name: Check source and renderer bundle
        run: npm run check

      - name: Smoke test SSH simulation
        run: npm run smoke:ssh

      - name: Smoke test MCP gateway
        run: npm run smoke:mcp

      - name: Smoke test bind scopes
        run: npm run smoke:bind

      - name: Smoke test port diagnostics
        run: npm run smoke:ports

      - name: Build Windows x64 installer
        run: npm run dist:win64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release\SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonolithSSH-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem release -Filter '*.exe' -File | ForEach-Object { $_.FullName }
            (Resolve-Path release\SHA256SUMS.txt).Path
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG
              '--repo', $env:GITHUB_REPOSITORY
              '--target', $env:GITHUB_SHA
              '--title', "MonolithSSH $env:RELEASE_TAG"
              '--generate-notes'
            )
            if ($env:RELEASE_TAG.Contains('-')) {
              $arguments += '--prerelease'
            }
            $arguments += $assets
            & gh @arguments
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed with exit code $LASTEXITCODE."
          }

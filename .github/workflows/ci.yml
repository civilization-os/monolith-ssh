name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Validate Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and renderer bundle
        run: npm run check

      - name: Smoke test SSH simulation
        run: npm run smoke:ssh

      - name: Smoke test MCP gateway
        run: npm run smoke:mcp

      - name: Smoke test bind scopes
        run: npm run smoke:bind

      - name: Smoke test port diagnostics
        run: npm run smoke:ports
